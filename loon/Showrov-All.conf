# Showrov All Plugins — permanent update URLs
# Optional DIRECT-CONNECTION profile. Export your current configuration first.
# To retain existing routing/certificate, update only its matching [Plugin] entries.
# Enter matching keys in Loon and keep only one enabled copy of each plugin.
# Requires Loon 3.5.3 (1014) or newer. Spotify seeking remains unverified.

[General]
dns-server = system

[Rule]
FINAL,DIRECT

# Permanent plugin URLs. Replace matching existing entries; do not create duplicates.
[Plugin]
https://raw.githubusercontent.com/showrovbd/youtubepremiumios/loon-preview/loon/apps/Showrov-YouTube.lpxe,tag=Showrov-YouTube,enable=true
https://raw.githubusercontent.com/showrovbd/youtubepremiumios/loon-preview/loon/apps/Showrov-Spotify.lpxe,tag=Showrov-Spotify,enable=true
https://raw.githubusercontent.com/showrovbd/youtubepremiumios/loon-preview/loon/apps/Showrov-PicsArt.lpxe,tag=Showrov-PicsArt,enable=true
https://raw.githubusercontent.com/showrovbd/youtubepremiumios/loon-preview/loon/apps/Showrov-AlightMotion.lpxe,tag=Showrov-AlightMotion,enable=true
https://raw.githubusercontent.com/showrovbd/youtubepremiumios/loon-preview/loon/apps/Showrov-Truecaller.lpxe,tag=Showrov-Truecaller,enable=true

[Mitm]
enable = true
# No certificate, private key or access key is included. Use your own trusted
# Loon certificate and enable HTTPS decryption, Rewrite and Script.
