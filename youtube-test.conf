#!name = YouTube Test
#!desc = YouTube-only test configuration. No key protection.

[Rule]
AND,((DOMAIN-SUFFIX,googlevideo.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,youtubei.googleapis.com),(PROTOCOL,UDP)),REJECT

[Url Rewrite]
^https?://[\w-]+\.googlevideo\.com/(?!(dclk_video_ads|videoplayback\?)).+&oad _ reject-200
^https?://(www|s)\.youtube\.com/api/stats/ads _ reject-200
^https?://(www|s)\.youtube\.com/(pagead|ptracking) _ reject-200
^https?://s\.youtube\.com/api/stats/qoe\?adcontext _ reject-200
(^https?://[\w-]+\.googlevideo\.com/(?!dclk_video_ads).+?)&ctier=L(&.+?),ctier,(.+) $1$2$3 302

[Script]
youtube.response = type=http-response,pattern=^https://youtubei\.googleapis\.com/youtubei/v1/(browse|next|player|search|reel/reel_watch_sequence|guide|account/get_setting|get_watch),requires-body=1,max-size=-1,binary-body-mode=1,script-path=https://raw.githubusercontent.com/Phuocdz28/Module_IOS/34865755c1aee7ba770c1afa364254d8924cfd85/js/youtube.response.js
youtube.diagnostic = type=http-request,pattern=^https://youtubei\.googleapis\.com/,requires-body=0,engine=jsc,timeout=5,script-path=https://raw.githubusercontent.com/showrovbd/youtubepremiumios/main/youtube-diagnostic.js

[Map Local]
^https?://[\w-]+\.googlevideo\.com/initplayback.+&oad data-type=text data="" status-code=200

[MITM]
hostname = *.googlevideo.com, youtubei.googleapis.com, www.youtube.com, s.youtube.com, -redirector*.googlevideo.com
